name: Build OpenScan Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: openscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build OpenScan Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify project
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build debug APK only
        run: flutter build apk --debug

      - name: Prepare OpenScan debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/OpenScan-debug.apk
          ls -lh artifacts/OpenScan-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenScan-debug-APK
          path: artifacts/OpenScan-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish debug APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openscan-debug-${{ github.run_number }}
          name: OpenScan Debug Build ${{ github.run_number }}
          body: |
            OpenScan debug APK generated automatically by GitHub Actions.

            Build type: DEBUG only
            APK: OpenScan-debug.apk
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: artifacts/OpenScan-debug.apk
