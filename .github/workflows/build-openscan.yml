name: Build OpenScan Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: openscan-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Verify project
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # The project expects key.properties for release signing.
      # For a zero-secret GitHub build, sign the release APK with the
      # standard Android debug key on the CI runner. This is installable
      # for testing, but should NOT be used for Play Store publishing.
      - name: Configure CI signing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          old = 'signingConfig signingConfigs.release'
          new = 'signingConfig signingConfigs.debug'

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('CI signing configured: release build will use debug signing key.')
          else:
              print('Release signing line not found; leaving build.gradle unchanged.')
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/OpenScan-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/OpenScan-debug.apk
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenScan-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
